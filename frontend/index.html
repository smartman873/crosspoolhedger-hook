<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CrossPoolHedger · Cross-Pool IL Hedging</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              ink: "#08080B",
              panel: "#0C0C11",
              panel2: "#101017",
              hair: "rgba(255,255,255,0.06)",
              hair2: "rgba(255,255,255,0.10)",
              violet: { DEFAULT: "#7C5CFF", soft: "#9B86FF", deep: "#5B3FD6" },
              cyan: { DEFAULT: "#22D3EE", soft: "#67E8F9" },
              good: "#34D399",
              warn: "#FBBF24",
              bad: "#FB7185",
              txt: "#E7E7EC",
              dim: "#8A8A99",
            },
            fontFamily: {
              sans: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"],
              mono: ["JetBrains Mono", "ui-monospace", "SFMono-Regular", "monospace"],
            },
          },
        },
      };
    </script>
    <style>
      html { background: #08080B; }
      body { margin: 0; color: #E7E7EC; font-family: Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
      ::selection { background: rgba(124,92,255,0.35); }
      ::-webkit-scrollbar { width: 9px; height: 9px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.10); border-radius: 99px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(124,92,255,0.45); }
      input[type="range"] { -webkit-appearance: none; appearance: none; height: 4px; border-radius: 99px; background: rgba(255,255,255,0.12); outline: none; }
      input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #7C5CFF; cursor: pointer; box-shadow: 0 0 0 4px rgba(124,92,255,0.18); }
      @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes pulseDot { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .45; transform: scale(.82); } }
      @keyframes shimmer { 0% { background-position: -480px 0; } 100% { background-position: 480px 0; } }
      @keyframes flow { 0% { stroke-dashoffset: 28; } 100% { stroke-dashoffset: 0; } }
      @keyframes slideIn { from { opacity: 0; transform: translateX(28px); } to { opacity: 1; transform: translateX(0); } }
      .anim-fadeup { animation: fadeUp .45s cubic-bezier(.22,.61,.36,1) both; }
      .anim-slidein { animation: slideIn .35s cubic-bezier(.22,.61,.36,1) both; }
      .dot-pulse { animation: pulseDot 1.6s ease-in-out infinite; }
      .skeleton { background: linear-gradient(90deg, rgba(255,255,255,0.04) 25%, rgba(255,255,255,0.09) 37%, rgba(255,255,255,0.04) 63%); background-size: 960px 100%; animation: shimmer 1.4s linear infinite; }
      .flow-line { stroke-dasharray: 6 6; animation: flow 1s linear infinite; }
      .hero-grid-bg { background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,0.05) 1px, transparent 0); background-size: 22px 22px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
